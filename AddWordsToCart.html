  <script>
    let cartes = JSON.parse(localStorage.getItem('cartes'));
    
    console.log(cartes);

    const index = localStorage.getItem('index');
    console.log(index);


    const search = document.getElementById('search');
    const input = document.getElementById('input');
    const impossible = document.getElementById('impossible');
    const cartas = document.getElementById('cartas');
    const wordsNum = document.getElementById('wordsNum');
    wordsNum.textContent = cartes[index].wordMeaningCarts.length;
    
    
    search.addEventListener('click', () => {
      impossible.innerHTML = `Couldn't find "<span>${input.value}</span>" in the dictionary.
      <a  class="ajouterAfter" href="wordMeaning.html"><p class="ajouter" >Add this word manually</a></p>`;
    });
    
    
    

    



     cartes[index].wordMeaningCarts.forEach((element, ind) => {
     const carr = document.createElement('div');
     carr.innerHTML =`
     <div>
      <div  style="display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #dec789;
      padding-top:0.5rem;
      ">
            <div><span class="word">${element.word}</span></div>

            <div style="display: flex;
      justify-content: space-between;
      ">
              <span class="prononce" style="margin-right:1rem"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="20px" fill="#6a5417"><path d="M560-131v-82q90-26 145-100t55-168q0-94-55-168T560-749v-82q124 28 202 125.5T840-481q0 127-78 224.5T560-131ZM120-360v-240h160l200-200v640L280-360H120Zm440 40v-322q47 22 73.5 66t26.5 96q0 51-26.5 94.5T560-320ZM400-606l-86 86H200v80h114l86 86v-252ZM300-480Z"/></svg></span>
              
              <span class="corbeille"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="20px" fill="#6a5417"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg></span>
              </div>

             </div>
        
        
              <div style="margin-bottom:0.5rem; margin-top:0rem">
                    <p class="meaning">${element.meaning}</p>
                    </div>
        
        
        </div> 
              `

           cartas.appendChild(carr);
           
          });
          console.log(cartes[index].wordMeaningCarts);

          const corbeille = document.querySelectorAll('.corbeille');
          corbeille.forEach((element, indexo) => {
           element.addEventListener('click', ()=> {
             console.log(indexo);
             cartes[index].wordMeaningCarts.splice(indexo, 1);
             localStorage.setItem('cartes', JSON.stringify(cartes));
             location.reload();
           });
          });

          const prononce = document.querySelectorAll('.prononce');
          const audio = window.speechSynthesis;
          prononce.forEach((element, ind) => {
            element.addEventListener('click', () => {
              const thisWord = new SpeechSynthesisUtterance(cartes[index].wordMeaningCarts[ind].word);
              thisWord.lang = 'fr-FR'
              audio.speak(thisWord);
            });
          });

          const PracticeVocab = document.querySelectorAll('.PracticeVocab');
          PracticeVocab.forEach(element => {
            element.addEventListener('click', ()=> {
              if(cartes[index].wordMeaningCarts.length <1) {
              alert('Add some words first!');
              } else {
                window.location.href='PracticeWordMean.html'
              }
            });
          });
          
  </script>
